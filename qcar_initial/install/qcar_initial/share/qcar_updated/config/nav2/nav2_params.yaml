amcl:
  ros__parameters:
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    use_sim_time: true
    # Raised from 0.2 (all 5) - live-measured map->odom TF jumps of up to 7cm/2.3deg in a single
    # 0.2s step during goal-approach reorientation maneuvers (K-turns with reversing), visible as
    # lidar points "jumping" in the map frame each time AMCL corrects. Likely cause: real wheel
    # odometry drift is higher during tight/reversing motion (more slip) than the noise model
    # alpha1-5=0.2 assumed, so AMCL underestimated uncertainty between scan-match updates and had
    # to correct in large, sudden jumps to catch up. Raising these lets the particle filter track
    # a wider, more realistic pose uncertainty during maneuvering, converging more gradually
    # instead of snapping. See CHANGELOG.md 2026-07-15 (2).
    alpha1: 0.4
    alpha2: 0.4
    alpha3: 0.4
    alpha4: 0.4
    alpha5: 0.4
    base_frame_id: "base"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.15
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    # Lowered from 0.2/0.25 - re-localizes more often (smaller corrections each time) rather than
    # accumulating more drift between updates and correcting in a single larger jump. Paired with
    # the alpha increases above. See CHANGELOG.md 2026-07-15 (2).
    update_min_a: 0.1
    update_min_d: 0.15
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    plugin_lib_names:
      - nav2_assisted_teleop_action_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_back_up_action_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_controller_selector_bt_node
      - nav2_distance_controller_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_is_battery_charging_condition_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_planner_selector_bt_node
      - nav2_progress_checker_selector_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_single_trigger_bt_node
      - nav2_smoother_selector_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_speed_controller_bt_node
      - nav2_spin_action_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_get_pose_from_path_action_bt_node

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # required_angular_distance is not implemented by this Humble version of
      # SimpleProgressChecker (added in a later nav2 release) - progress is judged by linear
      # displacement alone. required_linear_distance lowered and movement_time_allowance added
      # explicitly so a low-net-displacement heading-correction maneuver (forward/reverse
      # micro-moves near the goal, e.g. with allow_reversing:true) isn't wrongly flagged as
      # "stuck" mid-maneuver.
      required_linear_distance: 0.1
      required_angular_distance: 0.1
      movement_time_allowance: 30.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      # Widened slightly from 0.1 as of 2026-07-15 (3) - after removing PreferForwardCritic (see
      # FollowPath below), a live-tested K-turn goal converged to within 14.5cm/0.22deg of the
      # true goal but never quite latched "reached," cycling through repeated
      # progress_checker-triggered abort/retries instead of completing cleanly. That's a genuine
      # final-convergence gap now, not the "doesn't follow the plan at all" failure from before -
      # 0.12m is still a tight, meaningful tolerance for this vehicle, just enough to let a
      # closely-converged approach like that one actually finish instead of cycling forever.
      xy_goal_tolerance: 0.12
      # Final heading DOES matter (reverted the earlier ~2.9 rad "accept anything" workaround -
      # that was masking the problem, not fixing it). Now that GridBased is SmacPlannerHybrid
      # (kinematically-aware, plans the actual approach/K-turn into the path itself instead of
      # leaving RegulatedPurePursuitController to improvise one reactively), the path should
      # arrive much closer to the true requested orientation, so a real tolerance should be
      # achievable without the previous oscillation. Start here and tighten further once verified
      # - see the 2026-07-14 entries in CHANGELOG.md for the full diagnosis history.
      #
      # Widened from 0.3 to 0.5 by the user directly (hands-on tuning, 2026-07-20), together with
      # planner_server.GridBased.minimum_turning_radius raised to 1.0 below - user-confirmed this
      # combination navigates to goals "almost accurately," a clear improvement. Note this
      # contradicts an earlier single-parameter finding: minimum_turning_radius: 1.0 tested alone
      # (yaw_goal_tolerance still at 0.3) previously live-tested WORSE on a K-turn goal (same
      # reversal pattern, wider swing - see CHANGELOG.md 2026-07-19 (2)/(3) history and that
      # parameter's own comment below). Likely explanation: a looser final-heading tolerance means
      # the goal checker no longer demands the tight exact-heading match that was forcing the
      # extreme loop-and-reverse maneuver minimum_turning_radius: 1.0 alone made worse - the two
      # values interact, so change them together, not independently. See CHANGELOG.md 2026-07-20.
      yaw_goal_tolerance: 0.5
    # MPPIController (not RegulatedPurePursuitController) as of 2026-07-14 (9) - see
    # CHANGELOG.md. RPP's lookahead-point pure-pursuit geometry has a real, confirmed-via-live-
    # testing instability at path cusps (reverse/direction-change points) in this Humble nav2
    # version - tuning lookahead distances, speed regulation, and the planner's reverse_penalty
    # all reduced but never reliably eliminated it (one goal would succeed, the next
    # geometrically-similar one would fail after 7+ minutes of retries). MPPI is a fundamentally
    # different algorithm: it samples many candidate trajectories each control cycle and scores
    # them against a set of cost critics, rather than tracking a single lookahead point along the
    # path - it doesn't have RPP's specific cusp/carrot-point failure mode at all, and natively
    # supports Ackermann kinematics with a real minimum-turning-radius constraint
    # (AckermannConstraints.min_turning_r, confirmed via
    # /opt/ros/humble/include/nav2_mppi_controller/motion_models.hpp).
    #
    # Only structural/load-bearing parameters are set explicitly here (motion model, velocity
    # limits, turning radius, which critics to load) - per-critic cost weights are left at nav2's
    # own built-in defaults rather than guessed at, since this package doesn't have local access
    # to the critics' .cpp source to verify non-default weight values with confidence. Retune
    # individual critic weights only after testing these defaults live.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      # LEFT AT THE DEFAULT 2000 after a 2026-07-19 (4) investigation into path-tracking accuracy
      # (see PathAlignCritic.cost_weight below for the (3) investigation that preceded this one).
      # Raising batch_size (more samples per cycle = lower sampling variance, unlike a critic
      # weight) was tested rigorously this time - 2 trials per config, an objective plan-vs-odom
      # nearest-point deviation metric (not eyeballing coordinates) - and DID measurably tighten
      # path-tracking: mean deviation 0.15-0.17m -> 0.10-0.11m, p90 0.33-0.41m -> 0.25-0.26m,
      # reproducible across trials at both 2500 and 3500. But it came with a real, also-reproduced
      # cost: control_frequency's 50ms/cycle budget started getting missed regularly (1 miss/trial
      # at the 2000 baseline vs 8-48 misses/trial at 2500/3500), and at 2500 this wasn't just a
      # CPU-headroom nicety - one otherwise-normal run took 4.5 MINUTES to finally converge near
      # the goal (vs ~30s at the 2000 baseline), cycling through 7+ progress_checker recoveries
      # oscillating just outside tolerance, before eventually succeeding. Tightening mid-path
      # tracking isn't worth risking that near the goal - reverted to 2000. See CHANGELOG.md
      # 2026-07-19 (4) for the full trial data before reattempting this.
      batch_size: 2000
      # vx_std/wz_std: restored to the plugin's shipped defaults (0.2/0.4) on 2026-07-19 (2),
      # reverting the 2026-07-18 tightening to 0.15/0.3. That earlier change traded away MPPI's
      # own escape mechanism for a different bug: each control cycle samples candidate
      # trajectories as noise added to the PREVIOUS cycle's control sequence (warm-started via
      # Optimizer::shiftControlSequence(), confirmed via nav2_mppi_controller/src/optimizer.cpp on
      # GitHub) - so once that sequence collapses toward near-zero velocity (the same MPPI-freeze
      # class of bug fixed elsewhere in this file), tighter sampling noise made it harder to
      # sample anything far enough from "near zero" to escape, and only a full Optimizer reset
      # (triggered by controller_server accepting a brand new FollowPath goal, i.e. after a
      # progress_checker recovery) reliably unstuck it. Live-confirmed the freeze recurred with a
      # goal requiring a long, tight-radius approach even after fixing the turning-radius margin
      # and blind-replan issues below - restoring the wider default sampling noise is what let
      # MPPI actually escape mid-maneuver, without waiting for a recovery cycle. This does trade
      # back some of the reduced path-wobble the 0.15/0.3 change bought - if wobble reappears,
      # prefer tuning PathAlignCritic/PathFollowCritic further over re-tightening these, since
      # tightening them reintroduces the freeze risk this fixes. See CHANGELOG.md 2026-07-19 (2).
      vx_std: 0.2
      vy_std: 0.0
      # TESTED 2026-08-02: lowered 0.4 -> 0.3 alone (not paired with vx_std) to check whether
      # MPPI's own sampling breadth, not any single critic's weighting, drives a measured ~0.4m
      # mid-maneuver path deviation on large-reorientation goals - four different critic/PID
      # changes (steering PID kd, PathFollowCritic/PathAngleCritic offset_from_furthest,
      # PathAlignCritic.cost_weight, GoalAngleCritic.threshold_to_consider) all failed to move
      # this number on the (-0.0005, -2.014, 180deg) reproduction goal. Live-tested with the same
      # repeatable harness: peak deviation 0.44m (baseline) -> 0.39m alone - a small, likely-
      # within-noise reduction (~12%, similar magnitude to other single-run differences seen in
      # this file), not a clear fix. No freeze regression observed this time (iteration_count: 2
      # below, unlike when this value was first tried at iteration_count: 1 and reverted).
      # Reverted to the default since the improvement isn't clearly beyond noise on one trial -
      # see CHANGELOG.md 2026-08-02 for the full before/after data across all five parameters
      # tested and the synthesis of what's actually going on.
      wz_std: 0.4
      vx_max: 0.3
      # Negative - allows reversing. Matches this vehicle's real reverse capability; magnitude
      # kept below vx_max since the plugin's own PID/physics were only ever tuned/verified for
      # forward speeds up to 0.3 m/s (see TUNING.md SS1).
      vx_min: -0.2
      vy_max: 0.0
      wz_max: 1.9
      # Raised from 1 on 2026-07-19 (2), alongside the vx_std/wz_std restoration above - a second
      # optimization pass per control cycle lets MPPI refine away from a bad warm-started sequence
      # within the SAME cycle, rather than relying solely on next-cycle sampling luck. Doubles
      # per-cycle optimizer CPU cost; still well within controller_frequency's 50ms budget at this
      # batch_size/time_steps.
      iteration_count: 2
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "Ackermann"
      # Enabled 2026-07-18 (4) at user request, to expose two debug-only topics for RViz
      # (confirmed via nav2_mppi_controller/src/trajectory_visualizer.cpp on GitHub - both are
      # gated behind this flag and publish nothing while it's false): /trajectories
      # (visualization_msgs/MarkerArray - every sampled candidate trajectory plus the chosen
      # optimal one, each control cycle) and transformed_global_plan (nav_msgs/Path - the local,
      # controller-side portion of the plan MPPI is actively tracking, as distinct from /plan's
      # full raw global output from planner_server). Adds publishing/marker-array overhead - turn
      # back off for normal (non-debugging) runs.
      visualize: true
      # MPPI has dedicated handling for a path containing a cusp/reversal (a Reeds-Shepp K-turn
      # segment, as SmacPlannerHybrid can produce - see planner_server.GridBased below): without
      # enforce_path_inversion: true, it defaults to false
      # (/opt/ros/humble/include/nav2_mppi_controller/tools/path_handler.hpp), which means it was
      # not correctly treating the path as "drive to the cusp, then continue past it" - this was
      # the actual cause of the robot not following the planned path at all after the initial
      # MPPI switch. inversion_xy_tolerance/inversion_yaw_tolerance are the position/heading
      # windows (defaults from the same header) within which the robot is considered to have
      # reached the cusp and MPPI advances to the path segment beyond it.
      enforce_path_inversion: true
      inversion_xy_tolerance: 0.2
      inversion_yaw_tolerance: 0.4
      AckermannConstraints:
        # This vehicle's true hard limit (kept at 0.5, NOT matched to
        # planner_server.GridBased.minimum_turning_radius below anymore - see that parameter's
        # comment and CHANGELOG.md 2026-07-19 (2). Deliberately kept lower than the planner's 0.7
        # so every planned curve has real margin before MPPI's own sampled trajectories are
        # anywhere near what ConstraintCritic actually penalizes.
        min_turning_r: 0.5
      # PreferForwardCritic REMOVED as of 2026-07-15 (3) - fetched its actual source
      # (nav2_mppi_controller/src/critics/prefer_forward_critic.cpp): it penalizes any reverse
      # velocity (cost_weight 5.0) for as long as the robot is more than threshold_to_consider
      # (0.5m default) from the goal. PathFollowCritic, meanwhile, stops enforcing the planned
      # path inside ITS OWN threshold_to_consider (1.4m default) - leaving a 0.5m-1.4m "dead
      # zone" around the goal where nothing enforces the planned path but PreferForwardCritic is
      # still actively fighting any reverse motion. A K-turn's reversal segment plausibly falls
      # in exactly that zone, causing the executed trajectory to diverge from a plan that
      # correctly included a reverse - confirmed by the user visually (plan shows a reverse, the
      # robot doesn't execute it). This vehicle needs real reversing capability - a critic whose
      # entire purpose is discouraging reverse motion is fundamentally at odds with that, and is
      # redundant with planner_server.GridBased.reverse_penalty below, which already discourages
      # *unnecessary* reversing at the path-planning level without fighting a reverse the plan
      # has already decided is needed.
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
                "EarlyCommitCritic"]
      # Per-critic overrides below - defaults verified directly against the Humble source
      # (github.com/ros-navigation/navigation2, humble branch, nav2_mppi_controller/src/critics/)
      # rather than guessed, since local headers only expose parameter names, not default values.
      # NOTE: EarlyCommitCritic is a custom critic defined in THIS package (src/critics/
      # early_commit_critic.cpp - class mppi::critics::EarlyCommitCritic, required namespace per
      # nav2_mppi_controller's CriticManager::getFullName()), not part of stock nav2 - referenced
      # here by its bare name like every other critic in the list above.
      EarlyCommitCritic:
        # Custom critic added 2026-07-18 (9) - see CHANGELOG.md for the full investigation and
        # src/critics/early_commit_critic.cpp for the implementation. Scores only the first
        # early_time_steps of each sampled trajectory against the bearing to a near-term path
        # point, with no threshold_to_consider/max_angle_to_furthest gate (unlike stock
        # PathAngleCritic) - specifically to make MPPI commit to the path's initial curvature
        # from the very first control cycle instead of settling into a near-straight local
        # optimum. IS gated on active_path_points though: live-tested with no such gate and it
        # broke ordinary path-following for the rest of the trip, since this critic's fixed
        # near-term target stops being a meaningful signal once real progress has been made.
        offset_from_furthest: 3
        early_time_steps: 10
        # active_path_points lowered from 15 to 8 on 2026-07-19 (5) - user reported the robot
        # turning before the planned curve actually starts and deviating enough to risk hitting
        # obstacles. Live-confirmed via a /plan-vs-/odom comparison on a goal whose path runs
        # straight for ~1m before curving (curve starts around path point 15-16): at the SAME x
        # position, actual y was up to 3x the planned y well before the curve began (e.g. actual
        # y=0.169 vs planned y=0.055 at x~1.0) - this critic's weight (15.0, the highest of any
        # critic in use) combined with no distance/urgency gating meant it kept pulling toward a
        # near-term look-ahead target for the entire first 15 path points regardless of whether a
        # curve was actually imminent, and for this goal that window reached far enough to grab
        # the upcoming curve early. Lowering to 8 measurably reduced this (same comparison: actual
        # y dropped to ~1.9x planned at the same point, down from ~3x) without regressing the
        # original "curve at trip start" case this critic exists for - live-verified `(0.6, 0.8,
        # 90deg)` from a standing start still completes cleanly (`Reached the goal!`). Deviation
        # is reduced, not eliminated - PathFollowCritic/PathAngleCritic have their own smaller
        # look-ahead offsets (offset_from_furthest 3/2 below) that are NOT gated by
        # active_path_points and likely account for the remainder. See CHANGELOG.md 2026-07-19 (5).
        active_path_points: 8
        # false (nav2_mppi_controller's own reversing-allowed convention, see
        # utils::posePointAngle) as of 2026-07-19 - a SmacPlannerHybrid Reeds-Shepp path can
        # legitimately need a reverse (K-turn) segment anywhere a sharp reorientation is needed,
        # not just at trip start. At true (forward-only), this critic scores a correct reverse
        # segment as ~180deg wrong, fighting the maneuver and freezing the robot in the same way
        # (9) fixed for trip start - see CHANGELOG.md 2026-07-19 (1).
        forward_preference: false
        cost_weight: 15.0
      CostCritic:
        # consider_footprint defaults to FALSE - collision/obstacle cost was being evaluated at
        # the robot's center point only, not its actual elongated footprint. This was a real bug
        # (docs claimed true, the yaml never actually set it) and a plausible direct cause of
        # corner-cutting near obstacles for a car-shaped robot. See CHANGELOG.md 2026-07-14 (11).
        consider_footprint: true
      GoalCritic:
        # raised from the default 5.0 - final position was reported inaccurate (outside the 10cm
        # xy_goal_tolerance) even when nav2 considered the goal "reached." Strengthens convergence
        # to the exact goal point within GoalCritic's 1.4m threshold_to_consider, relative to
        # PathAlignCritic's competing weight of 10.0 over the same final approach.
        cost_weight: 8.0
      GoalAngleCritic:
        # raised from the default 3.0 to 10.0 on 2026-07-18 (5) - fixes "robot doesn't move when
        # given a new goal that's mostly a reorientation" (e.g. re-sending the same position with
        # a different final yaw shortly after reaching a goal). Root cause (confirmed by reading
        # utils::withinPositionGoalTolerance in nav2_mppi_controller/tools/utils.hpp): PathAlign/
        # PathFollow/PathAngle Critic all gate on the ROBOT'S CURRENT distance to the goal, not
        # progress along the plan. When a new goal sits at (near) the robot's current position,
        # that distance is ~0 from the very first control cycle, so all three are disabled for
        # the ENTIRE maneuver - not just the final approach, as threshold_to_consider below was
        # written to assume. That leaves only GoalAngleCritic (weight 3.0 by default) to drive
        # the reorientation, which combined with ConstraintCritic's turning-radius penalty
        # (discourages high angular rate at low forward speed - see AckermannConstraints below)
        # was too weak to reliably pull MPPI's sampled trajectories out of a near-zero-velocity
        # local optimum. An Ackermann vehicle cannot change heading at zero linear velocity, so
        # once nothing incentivizes the small forward/reverse motion the reorientation needs, the
        # robot just sits there. Live reproduced repeatedly (robot frozen, cmd_vel ~0, for 60s+)
        # before this fix. Tried cost_weight 30.0 first - it did unstick the reorientation case,
        # but also caused a separate, normal (non-reorientation) goal to stall on its final
        # approach, live-verified as a regression. 10.0 was live-tested clean on both: a short
        # direct-approach goal (unaffected, same ~6-11s completion as baseline) and the exact
        # "same position, +90deg yaw" reproduction (previously stuck indefinitely; with this
        # fix, either converges directly or is recovered by controller_server's existing
        # progress_checker + recovery-behavior retry within roughly 30-80s, instead of never).
        # Not an instant/clean fix - the underlying critic-gating gap above is still present -
        # but converts a permanent hang into an eventual, automatic recovery.
        #
        # TESTED 2026-08-02: added an explicit threshold_to_consider: 0.5 (previously unset, at
        # nav2's unstated built-in default) on the hypothesis that this critic was competing with
        # path-following critics too far from the goal, causing a measured mid-maneuver trajectory
        # swing on the (-0.0005, -2.014, 180deg) reproduction goal. Live-tested with a repeatable
        # plan-vs-odom deviation harness: peak deviation 0.44m (baseline) -> 0.41m (with the gate) -
        # within noise, not a real fix. Reverted; not the dominant mechanism.
        cost_weight: 10.0
      PathFollowCritic:
        # threshold_to_consider lowered further to 0.15m on 2026-07-18 (5) - 0.5m (matching
        # PathAlignCritic's default, set on (3) to close the "dead zone" from (3)'s own history)
        # shrinks the window, near the end of a normal (non-reorientation) approach, where the
        # planned path stops being enforced before the goal-focused critics take over. NOTE: this
        # does NOT fix the "reorientation-in-place" bug described under GoalAngleCritic above -
        # confirmed via live testing that lowering this threshold has zero effect on that bug,
        # because it gates on distance to the robot's CURRENT position, which is already ~0 for
        # that scenario from the first control cycle regardless of the threshold's value. Kept
        # here only for the narrower "dead zone during normal final approach" case it does fix.
        threshold_to_consider: 0.15
        # offset_from_furthest lowered from the default 6 - user reported the robot turning
        # early relative to the planned path, before an upcoming curve actually starts. Read the
        # real scoring code (path_follow_critic.cpp on GitHub): this critic pulls each sampled
        # trajectory's endpoint toward the path point `offset_from_furthest` indices ahead of
        # wherever the robot has currently progressed to - a target that far ahead can land past
        # the start of an upcoming curve, pulling the trajectory (and hence the executed heading)
        # toward that curve before the robot has physically reached it. Lower value keeps the
        # target point closer to actual current progress.
        offset_from_furthest: 6
      PathAngleCritic:
        # offset_from_furthest lowered from the default 4, same reasoning and same mechanism as
        # PathFollowCritic above (confirmed via path_angle_critic.cpp on GitHub) - this critic
        # steers the robot's *heading* toward the path point this many indices ahead of current
        # progress, which is the more direct cause of visibly "turning early" into a curve.
        offset_from_furthest: 4
      PathAlignCritic:
        # offset_from_furthest lowered from the default 20 as of 2026-07-18 (3) - this parameter
        # works completely differently here than in PathFollowCritic/PathAngleCritic above:
        # reading the real scoring code (path_align_critic.cpp on GitHub), it's a gate, not a
        # look-ahead target - "if (path_segments_count < offset_from_furthest_) return;" means
        # PathAlignCritic (the highest-weighted critic in use, at 10.0) is completely INACTIVE
        # for the first `offset_from_furthest` path points of every trip. If a curve starts early
        # in the planned path, the strongest path-adherence critic simply isn't running yet
        # during that segment - only the weaker critics (already tuned above) are shaping the
        # trajectory there, which may not be enough on their own. User reported turning-early was
        # still happening after the PathAngle/PathFollow fix, which pointed at this.
        offset_from_furthest: 3
        # threshold_to_consider lowered from the default 0.5m to 0.15m on 2026-07-18 (5), same
        # reasoning and same "does not fix the reorientation-in-place bug" caveat as
        # PathFollowCritic's identical change above - see that comment block, and
        # GoalAngleCritic above for the fix that actually addresses that bug. See CHANGELOG.md
        # 2026-07-18 (5).
        threshold_to_consider: 0.15
        # cost_weight LEFT AT THE DEFAULT 10.0 (explicit here, not just inherited) after a
        # 2026-07-19 (3) investigation into "robot doesn't turn as much as the planned curve",
        # reported after restoring vx_std/wz_std to their wider defaults on (2) to fix the MPPI
        # warm-start freeze. Wider sampling was live-confirmed to make MPPI's tracking of the
        # plan's exact curve shape noticeably looser (a real, expected trade against (2)'s fix),
        # but attempting to compensate by raising JUST this weight did not produce a clean,
        # reliable improvement: 14.0 overshot the OTHER way (actual trajectory swung out to
        # x~0.84-0.89 against a planned ~0.49 at the same y) and stalled oscillating there; 12.0
        # produced the same overshoot pattern; and a dense-sampled run back at the 10.0 default
        # swung even wider (peak x~1.11) on a DIFFERENT run of the identical goal/config - i.e.
        # run-to-run variance from MPPI's own stochastic sampling is large enough at this wider
        # vx_std/wz_std that a single-run "increase this weight" experiment isn't reliable
        # evidence either way. Left at the default rather than chase that noise. If tighter
        # path-tracking is worth the freeze-risk trade-off, revisit with multiple trials per
        # candidate weight (not one), or address it via vx_std/wz_std/iteration_count instead of
        # this critic - see CHANGELOG.md 2026-07-19 (3) for the full investigation.
        cost_weight: 10.0

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      # SmacPlannerHybrid (not NavfnPlanner) - kinematically aware of this Ackermann car's real
      # minimum turning radius and, with motion_model_for_search: "REEDS_SHEPP", can plan an
      # explicit reverse/K-turn segment into the path itself when the goal orientation can't be
      # reached by a forward-only arc. NavfnPlanner has no concept of heading at all, so it
      # always handed FollowPath a path whose arrival tangent could be wildly different from the
      # requested goal orientation, leaving RegulatedPurePursuitController to improvise a
      # correction reactively tick-by-tick - that's what was causing the goal-approach
      # oscillation (see the 2026-07-14 entries in CHANGELOG.md for the full diagnosis history).
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.5
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      # REEDS_SHEPP (reversing re-enabled per user requirement) - allows the planner to include
      # reverse segments (K-turns) for large final-heading changes. This was tried, found unstable
      # with RegulatedPurePursuitController in this Humble nav2 version (indefinite wiggling with
      # no net progress at a path cusp), and switched to DUBIN (forward-only, no cusps) as a
      # stable workaround in 2026-07-14 (7) - but the user needs real reversing capability, so
      # it's back, paired with a much more conservative FollowPath configuration (smaller
      # lookahead distances, slower cusp approach - see controller_server.FollowPath above) aimed
      # at making the cusp transition stable rather than avoiding cusps altogether. This remains a
      # known-fragile combination in this nav2 version - see CHANGELOG.md 2026-07-14 (8).
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      # Wheelbase 0.25725m / tan(30deg max steer) = ~0.445m true minimum. Raised from 0.5 to 0.7
      # on 2026-07-19 - 0.5 exactly matched FollowPath.AckermannConstraints.min_turning_r (the
      # controller's hard limit) below, which sounds safe but isn't: it means the planner is free
      # to produce curves at EXACTLY the tightest radius MPPI is allowed to drive, leaving MPPI's
      # sampled trajectories zero margin - live-confirmed via a circle fit on a real /plan dump
      # (fitted radius 0.49999999m, i.e. dead on the minimum) that the robot froze on. Any
      # sampled trajectory noisier than perfect (normal, given vx_std/wz_std) curves slightly
      # tighter than 0.5m and gets hit by ConstraintCritic's turning-radius penalty, so MPPI kept
      # preferring straighter, cheaper trajectories instead of committing to the curve. 0.7 here
      # (planner) vs 0.5 (controller, unchanged - see AckermannConstraints.min_turning_r below)
      # gives every planned curve real slack before it's anywhere near what MPPI actually treats
      # as too tight. See CHANGELOG.md 2026-07-19 (2).
      #
      # Raised further, 0.7 -> 1.0, by the user directly (hands-on tuning, 2026-07-20), paired
      # with general_goal_checker.yaw_goal_tolerance widened to 0.5 above. User-confirmed this
      # combination reaches goals "almost accurately." This value alone (1.0, with
      # yaw_goal_tolerance still at 0.3) was previously live-tested in this session and found
      # WORSE on a K-turn reproduction goal - same reversal/loop shape as at 0.7, just scaled to a
      # wider swing (y to -0.41 vs -0.25). That test only varied this one parameter; it did not
      # test it together with the looser yaw tolerance. Change these two together if retuning -
      # see CHANGELOG.md 2026-07-20.
      minimum_turning_radius: 1.0
      # raised from 2.0 - makes the planner prefer a forward-only route even if longer, only
      # actually planning a reverse segment when the goal orientation truly can't be reached
      # forward-only. Fewer cusps encountered in practice = fewer chances to hit the residual
      # instability described above.
      reverse_penalty: 4.0
      # raised from the default 0.0 on 2026-07-18 (7) - see CHANGELOG.md for the investigation.
      # node_hybrid.cpp's own comment on this term is literally "penalizes wiggling": applied
      # whenever consecutive motion primitives change turning direction. At the default 0.0 there
      # is no cost at all for the planner inserting a short, unnecessary direction-changing
      # segment (observed live: a small reversal immediately followed by forward motion, right at
      # the start of nearly every plan whose initial heading doesn't already match the path
      # tangent) - which is what was driving the "stuck at path start" symptom, not an MPPI
      # tuning issue.
      change_penalty: 3.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.025
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base
      use_sim_time: true
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Real polygon footprint (base link frame), not a circular robot_radius approximation -
      # measured directly from models/qcar/QCarBody.stl: X -0.2006 to 0.2082 (0.409m length),
      # Y -0.0806 to 0.0754 (0.156m width), rounded outward with a small margin. Now directly
      # load-bearing for CostCritic.consider_footprint: true in controller_server.FollowPath -
      # footprint-aware collision checking against an undersized circle wouldn't actually protect
      # the car's real front/rear overhangs. See TUNING.md "Known mismatches" and CHANGELOG.md
      # 2026-07-14 (11).
      footprint: "[[0.22, 0.09], [0.22, -0.09], [-0.22, -0.09], [-0.22, 0.09]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base
      use_sim_time: true
      # See local_costmap's footprint above - same polygon, kept in sync.
      footprint: "[[0.22, 0.09], [0.22, -0.09], [-0.22, -0.09], [-0.22, 0.09]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait", "assisted_teleop"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base
    transform_timeout: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.3, 0.0, 1.0]
    min_velocity: [-0.3, 0.0, -1.0]
    max_accel: [1.5, 0.0, 2.0]
    max_decel: [-1.5, 0.0, -2.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - map_server
      - amcl
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother

controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

ackermann_steering_controller:
  ros__parameters:
    front_steering: true
    rear_wheels_names: ["base_wheelrr_joint", "base_wheelrl_joint"]
    front_wheels_names: ["base_hubfr_joint", "base_hubfl_joint"]

    wheelbase: 0.25725
    front_wheel_track: 0.1118
    rear_wheel_track: 0.1122
    front_wheels_radius: 0.033
    rear_wheels_radius: 0.033

    open_loop: false
    position_feedback: true
    use_stamped_vel: false
    reference_timeout: 0.5
    velocity_rolling_window_size: 10

    base_frame_id: base
    odom_frame_id: odom
    enable_odom_tf: true
    twist_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]

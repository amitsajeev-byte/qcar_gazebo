amcl:
  ros__parameters:
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    use_sim_time: false
    # Raised from 0.2 (all 5) - live-measured map->odom TF jumps of up to 7cm/2.3deg in a single
    # 0.2s step during goal-approach reorientation maneuvers (K-turns with reversing), visible as
    # lidar points "jumping" in the map frame each time AMCL corrects. Likely cause: real wheel
    # odometry drift is higher during tight/reversing motion (more slip) than the noise model
    # alpha1-5=0.2 assumed, so AMCL underestimated uncertainty between scan-match updates and had
    # to correct in large, sudden jumps to catch up. Raising these lets the particle filter track
    # a wider, more realistic pose uncertainty during maneuvering, converging more gradually
    # instead of snapping. See CHANGELOG.md 2026-07-15 (2).
    alpha1: 0.4
    alpha2: 0.4
    alpha3: 0.4
    alpha4: 0.4
    alpha5: 0.4
    base_frame_id: "base"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.15
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    # Lowered from 0.2/0.25 - re-localizes more often (smaller corrections each time) rather than
    # accumulating more drift between updates and correcting in a single larger jump. Paired with
    # the alpha increases above. See CHANGELOG.md 2026-07-15 (2).
    update_min_a: 0.1
    update_min_d: 0.15
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    plugin_lib_names:
      - nav2_assisted_teleop_action_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_back_up_action_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_controller_selector_bt_node
      - nav2_distance_controller_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_is_battery_charging_condition_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_planner_selector_bt_node
      - nav2_progress_checker_selector_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_single_trigger_bt_node
      - nav2_smoother_selector_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_speed_controller_bt_node
      - nav2_spin_action_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_get_pose_from_path_action_bt_node
      # qcar_bt_nodes (IsPathValidDebounced) reverted 2026-08-26 - see CHANGELOG.md.

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # required_angular_distance is not implemented by this Humble version of
      # SimpleProgressChecker (added in a later nav2 release) - progress is judged by linear
      # displacement alone. required_linear_distance lowered and movement_time_allowance added
      # explicitly so a low-net-displacement heading-correction maneuver (forward/reverse
      # micro-moves near the goal, e.g. with allow_reversing:true) isn't wrongly flagged as
      # "stuck" mid-maneuver.
      required_linear_distance: 0.1
      required_angular_distance: 0.1
      # TESTED 2026-08-25: lowering 30.0->8.0 (faster stuck-detection, to interrupt the MPPI
      # cusp-freeze sooner) was WORSE - BackUp recovery itself failed once (no room in the
      # corridor), never succeeded in 110s. Reverted to stock 30.0. Interrupting the freeze,
      # however triggered, made things worse, not better - don't re-attempt without addressing
      # why interruption itself seems to be the problem. See CHANGELOG.md 2026-08-25 and the
      # qcar_updated_mppi_cusp_freeze_investigation memory for full detail.
      movement_time_allowance: 30.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      # Widened slightly from 0.1 as of 2026-07-15 (3) - after removing PreferForwardCritic (see
      # FollowPath below), a live-tested K-turn goal converged to within 14.5cm/0.22deg of the
      # true goal but never quite latched "reached," cycling through repeated
      # progress_checker-triggered abort/retries instead of completing cleanly. That's a genuine
      # final-convergence gap now, not the "doesn't follow the plan at all" failure from before -
      # 0.12m is still a tight, meaningful tolerance for this vehicle, just enough to let a
      # closely-converged approach like that one actually finish instead of cycling forever.
      xy_goal_tolerance: 0.12
      # Final heading matters - now that GridBased is SmacPlannerHybrid (plans the K-turn/approach
      # into the path itself), a real tolerance is achievable without the oscillation an earlier
      # "accept anything" workaround was masking. Widened 0.3->0.5 together with
      # planner_server.GridBased.minimum_turning_radius (1.0 below) - user-confirmed this pairing
      # reaches goals "almost accurately." The two values interact (a looser heading tolerance
      # stops the goal checker from demanding the tight match that made minimum_turning_radius:1.0
      # alone worse) - change them together, not independently. See CHANGELOG.md 2026-07-14/20.
      #
      # FLAG 2026-09-02: briefly tried tightening 0.5->0.3 after a run succeeded with a visibly
      # wrong final orientation (0.5 rad/~28.6deg was silently accepting that). REVERTED same day
      # after the very next trial got dramatically worse (214s/6 failures vs the prior 89s/2 -
      # see CHANGELOG.md 2026-09-02) with a suspicious signature: 5 of 6 failures ran to EXACTLY
      # the 30s movement_time_allowance ceiling regardless of path length, i.e. the robot wasn't
      # moving at all for nearly the whole window, repeatedly, across multiple genuinely fresh
      # replans - not just the one-cusp "searching" freeze seen before. Root cause not isolated
      # (this was tested bundled with the Wait=2s change below, and this system has documented
      # real run-to-run variance even on an unchanged config - see the PathDeviationCritic 3-trial
      # comparison earlier in this file). Reverting BOTH unvalidated changes together to retest
      # from the last known-good state rather than guessing which one (or neither) was at fault.
      # The underlying 2026-07-19 pairing finding (minimum_turning_radius:1.0 alone, tight yaw,
      # was WORSE) still applies if this is revisited - change both together, not independently.
      #
      # FLAG 2026-09-02 (2): retrying a tightening, more conservatively this time - 0.5->0.4, NOT
      # back to 0.3. 0.3 specifically (with minimum_turning_radius still 1.0) is the exact pairing
      # 2026-07-19 already found worse once before, independent of anything from today, so going
      # straight back there would be retracing known-bad territory rather than a fresh test. This
      # time changing ONLY this value (Wait stays at 5s, untouched) so a regression - if any - is
      # actually attributable.
      #
      # RESULT: 0.4 alone (Wait still 5s) was clean - ~50.6s, 1 failure, real progress before that
      # failure (not the "stuck for the whole window" signature from the 0.3+Wait=2s regression) -
      # actually the best trial yet. See CHANGELOG.md 2026-09-02.
      #
      # FLAG 2026-09-02 (3): pushing further, 0.4->0.3, Wait still untouched at 5s. This IS the
      # exact value 2026-07-19 found worse when paired with minimum_turning_radius:1.0 (still 1.0)
      # - but that finding predates cusp_straightener, EarlyCommitCritic, and today's BT fix, so
      # it may no longer transfer to the current system. Testing it deliberately rather than
      # assuming either way. If this regresses, minimum_turning_radius is the next thing to retune
      # alongside it (per the original 07-19/20 pairing), not just revert yaw_goal_tolerance again.
      #
      # RESULT: 0.3 alone (Wait still 5s, isolated from the earlier confound) reproduced the same
      # bad signature - ~161s, 5 failures, 2 of them running to almost exactly the 30s
      # movement_time_allowance ceiling (30.15s/30.05s) with no real progress, vs. 0.4's clean
      # 50.6s/1-failure run. Confirms the 2026-07-19 minimum_turning_radius:1.0 + tight-yaw finding
      # still holds on today's system - not an artifact of the earlier Wait=2s confound.
      #
      # FLAG 2026-09-02 (4): RESTORED to 0.3 anyway, per explicit user decision - the project's
      # goal is final-goal ACCURACY, not speed, so the extra recovery time/failure count above is
      # an acceptable cost, not a defect, as long as the goal remains reachable. It is: the 0.3
      # trial above succeeded, using 5 of NavigateRecovery's 10 retries - well short of exhausting
      # the budget, not "stuck forever." If a future trial DOES exhaust the retry budget without
      # reaching the goal, that's the point where minimum_turning_radius needs retuning alongside
      # this (per the original 07-19/20 pairing) rather than just accepting more retries. See
      # CHANGELOG.md 2026-09-02.
      yaw_goal_tolerance: 0.3
    # MPPIController (not RegulatedPurePursuitController): RPP had a confirmed instability at path
    # cusps (reverse/direction-change points) in this Humble nav2 version that tuning lookahead
    # distances, speed regulation, and reverse_penalty never reliably eliminated. MPPI samples many
    # candidate trajectories per cycle and scores them against cost critics rather than tracking a
    # single lookahead point, so it doesn't have RPP's cusp/carrot-point failure mode, and natively
    # supports Ackermann kinematics with a real min-turning-radius constraint
    # (AckermannConstraints.min_turning_r below). See CHANGELOG.md 2026-07-14.
    #
    # Only structural/load-bearing parameters are set explicitly (motion model, velocity limits,
    # turning radius, which critics to load) - per-critic weights are left at nav2's own defaults
    # unless a specific override is documented below.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      # Raising batch_size (2000->2500/3500) measurably tightened path-tracking (mean deviation
      # 0.15-0.17m -> 0.10-0.11m) but regularly missed controller_frequency's 50ms/cycle budget,
      # and at 2500 one otherwise-normal run took 4.5 minutes to converge near the goal (vs ~30s at
      # 2000). Not worth risking near the goal for mid-path tightening - reverted to 2000. See
      # CHANGELOG.md 2026-07-19 (4) for the full trial data before reattempting.
      batch_size: 2000
      # vx_std/wz_std: kept at the plugin's shipped defaults (0.2/0.4), not the tighter 0.15/0.3
      # tried earlier - tighter sampling noise made it harder for MPPI to escape once its
      # warm-started control sequence (each cycle samples noise added to the PREVIOUS cycle's
      # sequence) collapsed toward near-zero velocity, the same freeze class fixed elsewhere in
      # this file. Wider defaults let MPPI escape mid-maneuver without waiting for a recovery
      # cycle. Trades back some path-wobble - if wobble reappears, prefer tuning
      # PathAlignCritic/PathFollowCritic over re-tightening these. See CHANGELOG.md 2026-07-19 (2).
      vx_std: 0.2
      vy_std: 0.0
      # TESTED lowering 0.4->0.3 alone (isolating from vx_std) on the hypothesis that MPPI's
      # sampling breadth, not any single critic's weight, drives mid-maneuver path deviation - a
      # small, likely-within-noise improvement (~12%), not a clear fix. Reverted to the default.
      # See CHANGELOG.md 2026-08-02.
      wz_std: 0.4
      vx_max: 0.3
      # Negative - allows reversing. Matches this vehicle's real reverse capability; magnitude
      # kept below vx_max since the plugin's own PID/physics were only ever tuned/verified for
      # forward speeds up to 0.3 m/s (see TUNING.md SS1).
      vx_min: -0.2
      vy_max: 0.0
      wz_max: 1.9
      # Raised from 1 on 2026-07-19 (2), alongside the vx_std/wz_std restoration above - a second
      # optimization pass per control cycle lets MPPI refine away from a bad warm-started sequence
      # within the SAME cycle, rather than relying solely on next-cycle sampling luck. Doubles
      # per-cycle optimizer CPU cost; still well within controller_frequency's 50ms budget at this
      # batch_size/time_steps.
      iteration_count: 2
      # FLAG 2026-09-02: was 1.7 with no comment/history at all - an undocumented drift from
      # nav2_mppi_controller's own stock default (1.5, path_handler.cpp), same pattern as the
      # offset_from_furthest discrepancy found earlier today. path_handler.cpp's
      # getGlobalPlanConsideringBoundsInCostmapFrame() uses this to bound, in real meters from the
      # robot's closest path point, how much of the plan is exposed to MPPI and every critic each
      # cycle - a more direct match than time_steps for "the robot leans toward a curve well before
      # reaching it" (live-confirmed on video: heading/position pulling toward a curve several
      # meters away while still on a straight section, well past EarlyCommitCritic's new
      # max_lead_distance:0.3 window, ruling that fix out as the cause of THIS deviation). Testing
      # a real reduction, 1.7->1.0, to see if shrinking the window the critics can see reduces the
      # premature lean. NOT validated live yet - if normal path-following degrades (critics need
      # enough plan visible to do their job, especially near a cusp/goal), this is the first value
      # to walk back up.
      prune_distance: 1.0
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "Ackermann"
      # Enabled 2026-07-18 (4) at user request, to expose two debug-only topics for RViz
      # (confirmed via nav2_mppi_controller/src/trajectory_visualizer.cpp on GitHub - both are
      # gated behind this flag and publish nothing while it's false): /trajectories
      # (visualization_msgs/MarkerArray - every sampled candidate trajectory plus the chosen
      # optimal one, each control cycle) and transformed_global_plan (nav_msgs/Path - the local,
      # controller-side portion of the plan MPPI is actively tracking, as distinct from /plan's
      # full raw global output from planner_server). Adds publishing/marker-array overhead - turn
      # back off for normal (non-debugging) runs.
      visualize: true
      # enforce_path_inversion: true is required for MPPI to correctly handle a path containing a
      # cusp/reversal (Reeds-Shepp K-turn, as SmacPlannerHybrid can produce) - without it, it
      # defaults to false (nav2_mppi_controller/tools/path_handler.hpp) and doesn't treat the
      # path as "drive to the cusp, then continue past it" at all.
      #
      # inversion_xy_tolerance/inversion_yaw_tolerance: the position/heading window within which
      # the robot is considered to have reached the cusp and MPPI reveals the path beyond it
      # (PathHandler::setPath(), path_handler.cpp) - both must be satisfied simultaneously. This
      # gating is the root mechanism behind the MPPI cusp-freeze investigation: a genuine
      # "chaotic curve/reverse-curve/curve" complaint in tight spaces traced to MPPI freezing for
      # tens of seconds right at a cusp before finally breaking through, structurally the same
      # "must precisely reach a hard pose" issue as the already-fixed final-goal reorientation
      # freeze (GoalAngleCritic.cost_weight above). TESTED 2026-08-25: widening 0.2/0.4->0.4/0.7
      # was WORSE (repeated progress_checker aborts well before even reaching the cusp) - reverted
      # to stock. Don't re-widen without testing xy/yaw independently and logging full /plan+/odom
      # runs. See CHANGELOG.md 2026-08-25 and the qcar_updated_mppi_cusp_freeze_investigation
      # memory for full detail.
      enforce_path_inversion: true
      inversion_xy_tolerance: 0.2
      inversion_yaw_tolerance: 0.4
      AckermannConstraints:
        # This vehicle's true hard limit (kept at 0.5, NOT matched to
        # planner_server.GridBased.minimum_turning_radius below anymore - see that parameter's
        # comment and CHANGELOG.md 2026-07-19 (2). Deliberately kept lower than the planner's 0.7
        # so every planned curve has real margin before MPPI's own sampled trajectories are
        # anywhere near what ConstraintCritic actually penalizes.
        min_turning_r: 0.5
      # PreferForwardCritic REMOVED: it penalizes any reverse velocity for as long as the robot is
      # more than its own threshold_to_consider from the goal, while PathFollowCritic stops
      # enforcing the planned path inside ITS threshold_to_consider - leaving a dead zone where
      # nothing enforces the plan but PreferForwardCritic still fights any reverse motion. A
      # K-turn's reversal segment falls in exactly that zone (confirmed: plan shows a reverse, the
      # robot doesn't execute it). This vehicle needs real reversing - redundant anyway with
      # planner_server.GridBased.reverse_penalty below, which discourages unnecessary reversing at
      # the planning level without fighting a reverse the plan already decided is needed. See
      # CHANGELOG.md 2026-07-15 (3).
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
                "EarlyCommitCritic"]
      # Per-critic overrides below - defaults verified directly against the Humble source
      # (github.com/ros-navigation/navigation2, humble branch, nav2_mppi_controller/src/critics/)
      # rather than guessed, since local headers only expose parameter names, not default values.
      # NOTE: EarlyCommitCritic is a custom critic defined in THIS package (src/critics/
      # early_commit_critic.cpp - class mppi::critics::EarlyCommitCritic, required namespace per
      # nav2_mppi_controller's CriticManager::getFullName()), not part of stock nav2 - referenced
      # here by its bare name like every other critic in the list above.
      EarlyCommitCritic:
        # Custom critic added 2026-07-18 (9) - see CHANGELOG.md for the full investigation and
        # src/critics/early_commit_critic.cpp for the implementation. Scores only the first
        # early_time_steps of each sampled trajectory against the bearing to a near-term path
        # point, with no threshold_to_consider/max_angle_to_furthest gate (unlike stock
        # PathAngleCritic) - specifically to make MPPI commit to the path's initial curvature
        # from the very first control cycle instead of settling into a near-straight local
        # optimum. Gated (see max_lead_distance below) though: live-tested ungated and it broke
        # ordinary path-following for the rest of the trip, since this critic's fixed near-term
        # target stops being a meaningful signal once real progress has been made.
        offset_from_furthest: 3
        early_time_steps: 10
        # REDESIGNED 2026-09-02: was active_path_points (a fixed count of path POINTS from trip
        # start: 15, then lowered to 8 same day as CHANGELOG.md 2026-07-19 (5) - a path-point count
        # is a poor proxy for physical distance. That entry live-confirmed the real bug this caused
        # ("robot turns before the curve", up to 3x the planned lateral offset on a path that runs
        # straight for ~1m before curving - the curve happened to fall inside the point-count
        # window). Lowering 15->8 only reduced it (~1.9x), not eliminated - and 2026-09-02 further
        # investigation ruled out that entry's own theory for the residual
        # (PathFollowCritic/PathAngleCritic.offset_from_furthest, bracketed across its full 6->3->1
        # range with zero effect), pointing squarely back at this critic's own gating.
        #
        # Replaced with a real Euclidean-distance gate against the same near-term target this
        # critic already scores against (src/critics/early_commit_critic.cpp), mirroring
        # cusp_straightener_smoother's already-proven min_lead_distance pattern: only fires while
        # that target is within max_lead_distance meters of the robot's actual current position,
        # regardless of path-point count. Naturally covers both cases with one mechanism - fires
        # immediately at genuine trip start (distance ~0, same as before) and stays suppressed for
        # a curve that's still physically far off (fixing the 07-19(5) residual). 0.3m reused from
        # cusp_straightener's own min_lead_distance value (not a fresh guess). NOT validated live
        # yet.
        max_lead_distance: 0.3
        # false (nav2_mppi_controller's own reversing-allowed convention, see
        # utils::posePointAngle) as of 2026-07-19 - a SmacPlannerHybrid Reeds-Shepp path can
        # legitimately need a reverse (K-turn) segment anywhere a sharp reorientation is needed,
        # not just at trip start. At true (forward-only), this critic scores a correct reverse
        # segment as ~180deg wrong, fighting the maneuver and freezing the robot in the same way
        # (9) fixed for trip start - see CHANGELOG.md 2026-07-19 (1).
        forward_preference: false
        cost_weight: 15.0
      # PathDeviationCritic (src/critics/path_deviation_critic.cpp): NOT in the active critics
      # list above - tested 2026-08-26, made things WORSE. Implements the user-proposed
      # "don't insist on an exact path rejoin when deviated, aim further ahead instead" idea, only
      # active past deviation_threshold. 3 trials on the same K-turn reproduction goal: 112.8s,
      # 71.7s, 38.4s (mean 74.3s, 0 recoveries) vs. the active config's own already-validated 45.2s,
      # 38.3s, 48.1s (mean 43.9s) - worse mean AND much wider variance, likely fighting
      # PathAlignCritic rather than helping. Reverted (code kept, deselected, same pattern as the
      # smoother's v1). See CHANGELOG.md 2026-08-26 before re-enabling.
      PathDeviationCritic:
        deviation_threshold: 0.3
        lookahead_offset: 15
        cost_weight: 8.0
      CostCritic:
        # consider_footprint defaults to FALSE - collision/obstacle cost was being evaluated at
        # the robot's center point only, not its actual elongated footprint. This was a real bug
        # (docs claimed true, the yaml never actually set it) and a plausible direct cause of
        # corner-cutting near obstacles for a car-shaped robot. See CHANGELOG.md 2026-07-14 (11).
        consider_footprint: true
      GoalCritic:
        # raised from the default 5.0 - final position was reported inaccurate (outside the 10cm
        # xy_goal_tolerance) even when nav2 considered the goal "reached." Strengthens convergence
        # to the exact goal point within GoalCritic's 1.4m threshold_to_consider, relative to
        # PathAlignCritic's competing weight of 10.0 over the same final approach.
        cost_weight: 8.0
      GoalAngleCritic:
        # Raised 3.0->10.0: fixes "robot doesn't move for a new goal that's mostly a
        # reorientation" (e.g. same position, different final yaw). Root cause: PathAlign/
        # PathFollow/PathAngle critics all gate on the robot's CURRENT distance to the goal, so
        # when a new goal sits at ~the robot's current position, all three are disabled for the
        # ENTIRE maneuver, leaving only GoalAngleCritic (+ConstraintCritic's turning-radius
        # penalty) to drive the reorientation - too weak at the default, so MPPI settled into a
        # near-zero-velocity local optimum (an Ackermann vehicle can't change heading at zero
        # linear velocity). 30.0 also unstuck it but regressed a separate normal goal's final
        # approach; 10.0 is clean on both. Not an instant fix - the underlying critic-gating gap is
        # still present - but converts a permanent hang into an eventual automatic recovery
        # (~30-80s via progress_checker). An explicit threshold_to_consider:0.5 was also tried
        # (hypothesis: competing with path-following critics too far from goal) - within noise, not
        # a real fix, reverted. See CHANGELOG.md 2026-07-18 (5) and 2026-08-02.
        cost_weight: 10.0
      PathFollowCritic:
        # threshold_to_consider lowered further to 0.15m on 2026-07-18 (5) - 0.5m (matching
        # PathAlignCritic's default, set on (3) to close the "dead zone" from (3)'s own history)
        # shrinks the window, near the end of a normal (non-reorientation) approach, where the
        # planned path stops being enforced before the goal-focused critics take over. NOTE: this
        # does NOT fix the "reorientation-in-place" bug described under GoalAngleCritic above -
        # confirmed via live testing that lowering this threshold has zero effect on that bug,
        # because it gates on distance to the robot's CURRENT position, which is already ~0 for
        # that scenario from the first control cycle regardless of the threshold's value. Kept
        # here only for the narrower "dead zone during normal final approach" case it does fix.
        threshold_to_consider: 0.15
        # offset_from_furthest: back at the stock default 6 as of 2026-09-02. Prior history
        # (2026-07-18 (2)) lowered this to 3 for a "turns early before a curve" report and
        # believed it fixed; TUNING.md later flagged that the live value never actually matched
        # that documented intent (still 6, undocumented discrepancy). Re-investigated 2026-09-02:
        # tried 3, then deliberately bracketed down to 1 (the lowest meaningful value) - the "turns
        # early" symptom persisted unchanged across the entire 6->3->1 range, RULING OUT this
        # parameter as the dominant cause. Reverted to the true stock default rather than leave it
        # at an arbitrary non-default value that demonstrably doesn't fix the reported symptom.
        # See CHANGELOG.md 2026-09-02 for the full bracketing investigation; next suspect flagged
        # there is the Gazebo steering_pid_gain (urdf/qcar_model.xacro), not yet examined.
        offset_from_furthest: 6
      PathAngleCritic:
        # offset_from_furthest: back at the stock default 4 as of 2026-09-02, same history and
        # same reasoning as PathFollowCritic.offset_from_furthest above - bracketed 4->2->1, no
        # qualitative change in the "turns early" symptom, ruled out as the dominant cause. See
        # CHANGELOG.md 2026-09-02.
        offset_from_furthest: 4
      PathAlignCritic:
        # offset_from_furthest lowered from the default 20 as of 2026-07-18 (3) - this parameter
        # works completely differently here than in PathFollowCritic/PathAngleCritic above:
        # reading the real scoring code (path_align_critic.cpp on GitHub), it's a gate, not a
        # look-ahead target - "if (path_segments_count < offset_from_furthest_) return;" means
        # PathAlignCritic (the highest-weighted critic in use, at 10.0) is completely INACTIVE
        # for the first `offset_from_furthest` path points of every trip. If a curve starts early
        # in the planned path, the strongest path-adherence critic simply isn't running yet
        # during that segment - only the weaker critics (already tuned above) are shaping the
        # trajectory there, which may not be enough on their own. User reported turning-early was
        # still happening after the PathAngle/PathFollow fix, which pointed at this.
        offset_from_furthest: 3
        # threshold_to_consider lowered from the default 0.5m to 0.15m on 2026-07-18 (5), same
        # reasoning and same "does not fix the reorientation-in-place bug" caveat as
        # PathFollowCritic's identical change above - see that comment block, and
        # GoalAngleCritic above for the fix that actually addresses that bug. See CHANGELOG.md
        # 2026-07-18 (5).
        threshold_to_consider: 0.15
        # LEFT AT THE DEFAULT 10.0 (explicit here, not just inherited): wider vx_std/wz_std
        # sampling (restored above to fix the MPPI warm-start freeze) makes MPPI's tracking of the
        # plan's exact curve shape noticeably looser, but raising just this weight to compensate
        # (12.0, 14.0) didn't produce a clean improvement - both overshot the other way and
        # stalled oscillating, and a dense-sampled run at the 10.0 default itself swung even wider
        # on a different run of the same goal, meaning MPPI's own run-to-run sampling variance is
        # too large for a single-trial weight experiment to be reliable evidence. If tighter
        # path-tracking is worth the freeze-risk trade-off, revisit with multiple trials per
        # candidate weight, or via vx_std/wz_std/iteration_count instead. See CHANGELOG.md
        # 2026-07-19 (3).
        cost_weight: 10.0

smoother_server:
  ros__parameters:
    use_sim_time: false
    # cusp_straightener is the LOCKED-IN config (see cusp_straightener_smoother.hpp for full
    # rationale) - a 3-vs-3-vs-3 trial comparison found it clearly better than no smoother on mean
    # time, mean recoveries, and worst case, and it has since been validated on real hardware too.
    # See CHANGELOG.md 2026-08-25/26 and the qcar_updated_mppi_cusp_freeze_investigation memory.
    smoother_plugins: ["cusp_straightener"]
    # simple_smoother configured here but never wired into the BT (no <SmoothPath> node call
    # exists in navigate_to_pose_w_replanning_and_recovery.xml) - effectively dead config.
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
    cusp_straightener:
      plugin: "qcar_updated::smoothers::CuspStraightenerSmoother"
      straight_distance: 0.21
      extend_distance: 0.15
      min_lead_distance: 0.3

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      # SmacPlannerHybrid (not NavfnPlanner) - kinematically aware of this Ackermann car's real
      # minimum turning radius and, with motion_model_for_search: "REEDS_SHEPP", can plan an
      # explicit reverse/K-turn segment into the path itself when the goal orientation can't be
      # reached by a forward-only arc. NavfnPlanner has no concept of heading at all, so it
      # always handed FollowPath a path whose arrival tangent could be wildly different from the
      # requested goal orientation, leaving RegulatedPurePursuitController to improvise a
      # correction reactively tick-by-tick - that's what was causing the goal-approach
      # oscillation (see the 2026-07-14 entries in CHANGELOG.md for the full diagnosis history).
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.5
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      # REEDS_SHEPP (reversing re-enabled per user requirement) - allows the planner to include
      # reverse segments (K-turns) for large final-heading changes. This was tried, found unstable
      # with RegulatedPurePursuitController in this Humble nav2 version (indefinite wiggling with
      # no net progress at a path cusp), and switched to DUBIN (forward-only, no cusps) as a
      # stable workaround in 2026-07-14 (7) - but the user needs real reversing capability, so
      # it's back, paired with a much more conservative FollowPath configuration (smaller
      # lookahead distances, slower cusp approach - see controller_server.FollowPath above) aimed
      # at making the cusp transition stable rather than avoiding cusps altogether. This remains a
      # known-fragile combination in this nav2 version - see CHANGELOG.md 2026-07-14 (8).
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      # Wheelbase 0.25725m / tan(30deg max steer) = ~0.445m true minimum. Raised 0.5->0.7->1.0,
      # now lowered back to 0.7.
      # 0.5 exactly matched FollowPath.AckermannConstraints.min_turning_r (the controller's hard
      # limit) below, leaving MPPI's sampled trajectories zero margin - any trajectory noisier than
      # perfect curved slightly tighter than 0.5m and got penalized, so MPPI kept preferring
      # straighter, cheaper trajectories instead of committing to the curve (confirmed via a circle
      # fit on a real /plan dump that froze: radius 0.49999999m, dead on the minimum). 0.7 (planner)
      # vs 0.5 (controller, unchanged) gives every planned curve real slack. Raised further to 1.0
      # by the user directly (hands-on tuning), paired with yaw_goal_tolerance widened to 0.5 above
      # - user-confirmed this combination reaches goals "almost accurately." This value alone (1.0,
      # tight yaw tolerance) was previously live-tested WORSE - change both together if retuning.
      # See CHANGELOG.md 2026-07-19 (2) and 2026-07-20.
      #
      # FLAG 2026-09-02: tried lowering 1.0->0.7, then 0.8, chasing a "turns more than the planned
      # curve, deviates off path" report. REVERTED back to 1.0 that same day - the same
      # investigation (see CHANGELOG.md 2026-09-02) found via video review that the actual symptom
      # was present from the very start of a curve (not just its tightness), pointing at
      # EarlyCommitCritic (fixed) and the plugin-collision bug (also fixed) instead. Set back to
      # 0.8 afterward (user request) now that both of those are fixed and sim-validated (4/4 clean
      # trials) - narrows the plan-vs-execution gap again while keeping real margin above
      # AckermannConstraints.min_turning_r's true 0.5 limit. NOT re-validated live yet at 0.8
      # specifically since the EarlyCommitCritic/plugin fixes landed - see the "HARDWARE
      # VALIDATION PENDING" checklist at the top of CHANGELOG.md.
      minimum_turning_radius: 0.8
      # raised from 2.0 - makes the planner prefer a forward-only route even if longer, only
      # actually planning a reverse segment when the goal orientation truly can't be reached
      # forward-only. Fewer cusps encountered in practice = fewer chances to hit the residual
      # instability described above.
      reverse_penalty: 4.0
      # raised from the default 0.0 on 2026-07-18 (7) - see CHANGELOG.md for the investigation.
      # node_hybrid.cpp's own comment on this term is literally "penalizes wiggling": applied
      # whenever consecutive motion primitives change turning direction. At the default 0.0 there
      # is no cost at all for the planner inserting a short, unnecessary direction-changing
      # segment (observed live: a small reversal immediately followed by forward motion, right at
      # the start of nearly every plan whose initial heading doesn't already match the path
      # tangent) - which is what was driving the "stuck at path start" symptom, not an MPPI
      # tuning issue.
      change_penalty: 3.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.025
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Real polygon footprint (base link frame), not a circular robot_radius approximation -
      # measured directly from models/qcar/QCarBody.stl: X -0.2006 to 0.2082 (0.409m length),
      # Y -0.0806 to 0.0754 (0.156m width), rounded outward with a small margin. Now directly
      # load-bearing for CostCritic.consider_footprint: true in controller_server.FollowPath -
      # footprint-aware collision checking against an undersized circle wouldn't actually protect
      # the car's real front/rear overhangs. See TUNING.md "Known mismatches" and CHANGELOG.md
      # 2026-07-14 (11).
      footprint: "[[0.22, 0.09], [0.22, -0.09], [-0.22, -0.09], [-0.22, 0.09]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base
      use_sim_time: false
      # See local_costmap's footprint above - same polygon, kept in sync.
      footprint: "[[0.22, 0.09], [0.22, -0.09], [-0.22, -0.09], [-0.22, 0.09]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait", "assisted_teleop"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base
    transform_timeout: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.3, 0.0, 1.0]
    min_velocity: [-0.3, 0.0, -1.0]
    max_accel: [1.5, 0.0, 2.0]
    max_decel: [-1.5, 0.0, -2.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - map_server
      - amcl
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother

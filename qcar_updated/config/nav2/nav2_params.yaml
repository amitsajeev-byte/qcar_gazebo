controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # required_angular_distance is not implemented by this Humble version of
      # SimpleProgressChecker (added in a later nav2 release) - progress is judged by linear
      # displacement alone. required_linear_distance lowered and movement_time_allowance added
      # explicitly so a low-net-displacement heading-correction maneuver (forward/reverse
      # micro-moves near the goal, e.g. with allow_reversing:true) isn't wrongly flagged as
      # "stuck" mid-maneuver.
      required_linear_distance: 0.1
      required_angular_distance: 0.1
      movement_time_allowance: 30.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1
      # Final heading DOES matter (reverted the earlier ~2.9 rad "accept anything" workaround -
      # that was masking the problem, not fixing it). Now that GridBased is SmacPlannerHybrid
      # (kinematically-aware, plans the actual approach/K-turn into the path itself instead of
      # leaving RegulatedPurePursuitController to improvise one reactively), the path should
      # arrive much closer to the true requested orientation, so a real tolerance should be
      # achievable without the previous oscillation. Start here and tighten further once verified
      # - see the 2026-07-14 entries in CHANGELOG.md for the full diagnosis history.
      yaw_goal_tolerance: 0.3
    # MPPIController (not RegulatedPurePursuitController) as of 2026-07-14 (9) - see
    # CHANGELOG.md. RPP's lookahead-point pure-pursuit geometry has a real, confirmed-via-live-
    # testing instability at path cusps (reverse/direction-change points) in this Humble nav2
    # version - tuning lookahead distances, speed regulation, and the planner's reverse_penalty
    # all reduced but never reliably eliminated it (one goal would succeed, the next
    # geometrically-similar one would fail after 7+ minutes of retries). MPPI is a fundamentally
    # different algorithm: it samples many candidate trajectories each control cycle and scores
    # them against a set of cost critics, rather than tracking a single lookahead point along the
    # path - it doesn't have RPP's specific cusp/carrot-point failure mode at all, and natively
    # supports Ackermann kinematics with a real minimum-turning-radius constraint
    # (AckermannConstraints.min_turning_r, confirmed via
    # /opt/ros/humble/include/nav2_mppi_controller/motion_models.hpp).
    #
    # Only structural/load-bearing parameters are set explicitly here (motion model, velocity
    # limits, turning radius, which critics to load) - per-critic cost weights are left at nav2's
    # own built-in defaults rather than guessed at, since this package doesn't have local access
    # to the critics' .cpp source to verify non-default weight values with confidence. Retune
    # individual critic weights only after testing these defaults live.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      vx_max: 0.3
      # Negative - allows reversing. Matches this vehicle's real reverse capability; magnitude
      # kept below vx_max since the plugin's own PID/physics were only ever tuned/verified for
      # forward speeds up to 0.3 m/s (see TUNING.md SS1).
      vx_min: -0.2
      vy_max: 0.0
      wz_max: 1.9
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "Ackermann"
      visualize: false
      # MPPI has dedicated handling for a path containing a cusp/reversal (a Reeds-Shepp K-turn
      # segment, as SmacPlannerHybrid can produce - see planner_server.GridBased below): without
      # enforce_path_inversion: true, it defaults to false
      # (/opt/ros/humble/include/nav2_mppi_controller/tools/path_handler.hpp), which means it was
      # not correctly treating the path as "drive to the cusp, then continue past it" - this was
      # the actual cause of the robot not following the planned path at all after the initial
      # MPPI switch. inversion_xy_tolerance/inversion_yaw_tolerance are the position/heading
      # windows (defaults from the same header) within which the robot is considered to have
      # reached the cusp and MPPI advances to the path segment beyond it.
      enforce_path_inversion: true
      inversion_xy_tolerance: 0.2
      inversion_yaw_tolerance: 0.4
      AckermannConstraints:
        # Matches planner_server.GridBased.minimum_turning_radius below - keep these two in sync.
        min_turning_r: 0.5
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      # Per-critic overrides below - defaults verified directly against the Humble source
      # (github.com/ros-navigation/navigation2, humble branch, nav2_mppi_controller/src/critics/)
      # rather than guessed, since local headers only expose parameter names, not default values.
      CostCritic:
        # consider_footprint defaults to FALSE - collision/obstacle cost was being evaluated at
        # the robot's center point only, not its actual elongated footprint. This was a real bug
        # (docs claimed true, the yaml never actually set it) and a plausible direct cause of
        # corner-cutting near obstacles for a car-shaped robot. See CHANGELOG.md 2026-07-14 (11).
        consider_footprint: true
      GoalCritic:
        # raised from the default 5.0 - final position was reported inaccurate (outside the 10cm
        # xy_goal_tolerance) even when nav2 considered the goal "reached." Strengthens convergence
        # to the exact goal point within GoalCritic's 1.4m threshold_to_consider, relative to
        # PathAlignCritic's competing weight of 10.0 over the same final approach.
        cost_weight: 8.0

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      # SmacPlannerHybrid (not NavfnPlanner) - kinematically aware of this Ackermann car's real
      # minimum turning radius and, with motion_model_for_search: "REEDS_SHEPP", can plan an
      # explicit reverse/K-turn segment into the path itself when the goal orientation can't be
      # reached by a forward-only arc. NavfnPlanner has no concept of heading at all, so it
      # always handed FollowPath a path whose arrival tangent could be wildly different from the
      # requested goal orientation, leaving RegulatedPurePursuitController to improvise a
      # correction reactively tick-by-tick - that's what was causing the goal-approach
      # oscillation (see the 2026-07-14 entries in CHANGELOG.md for the full diagnosis history).
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.5
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      # REEDS_SHEPP (reversing re-enabled per user requirement) - allows the planner to include
      # reverse segments (K-turns) for large final-heading changes. This was tried, found unstable
      # with RegulatedPurePursuitController in this Humble nav2 version (indefinite wiggling with
      # no net progress at a path cusp), and switched to DUBIN (forward-only, no cusps) as a
      # stable workaround in 2026-07-14 (7) - but the user needs real reversing capability, so
      # it's back, paired with a much more conservative FollowPath configuration (smaller
      # lookahead distances, slower cusp approach - see controller_server.FollowPath above) aimed
      # at making the cusp transition stable rather than avoiding cusps altogether. This remains a
      # known-fragile combination in this nav2 version - see CHANGELOG.md 2026-07-14 (8).
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      # Wheelbase 0.25725m / tan(30deg max steer) = ~0.445m true minimum - 0.5 adds a small
      # safety margin so the planner never asks for a curve tighter than the steering PID can
      # actually deliver.
      minimum_turning_radius: 0.5
      # raised from 2.0 - makes the planner prefer a forward-only route even if longer, only
      # actually planning a reverse segment when the goal orientation truly can't be reached
      # forward-only. Fewer cusps encountered in practice = fewer chances to hit the residual
      # instability described above.
      reverse_penalty: 4.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.025
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base
      use_sim_time: true
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Real polygon footprint (base link frame), not a circular robot_radius approximation -
      # measured directly from models/qcar/QCarBody.stl: X -0.2006 to 0.2082 (0.409m length),
      # Y -0.0806 to 0.0754 (0.156m width), rounded outward with a small margin. Now directly
      # load-bearing for CostCritic.consider_footprint: true in controller_server.FollowPath -
      # footprint-aware collision checking against an undersized circle wouldn't actually protect
      # the car's real front/rear overhangs. See TUNING.md "Known mismatches" and CHANGELOG.md
      # 2026-07-14 (11).
      footprint: "[[0.22, 0.09], [0.22, -0.09], [-0.22, -0.09], [-0.22, 0.09]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base
      use_sim_time: true
      # See local_costmap's footprint above - same polygon, kept in sync.
      footprint: "[[0.22, 0.09], [0.22, -0.09], [-0.22, -0.09], [-0.22, 0.09]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait", "assisted_teleop"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base
    transform_timeout: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.3, 0.0, 1.0]
    min_velocity: [-0.3, 0.0, -1.0]
    max_accel: [1.5, 0.0, 2.0]
    max_decel: [-1.5, 0.0, -2.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - map_server
      - amcl
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
